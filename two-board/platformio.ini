; Axiometa Genesis Mini (ESP32-S3-MINI-1: 4 MB flash, 2 MB QSPI PSRAM)
; pioarduino platform = Arduino-ESP32 3.x, needed for the ESP_I2S PDM microphone API.
;
; Two build targets (pick one in the VS Code status bar, or use -e on the command line):
;   control_test  encoder / stop button / buzzer / camera-interlock sketch
;   handheld      controller: encoder, stop button, buzzer, mic; sends ESP-NOW to the receiver
;   receiver      motor board: ESP-NOW commands from the handheld -> two AX22-0032 motor modules
;   rover         voice + route following firmware (single-board design, paused)

[platformio]
default_envs = control_test

; Settings shared by every env
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; PlatformIO has no Genesis Mini board, so use a generic ESP32-S3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Genesis Mini hardware, as defined by Arduino-ESP32 (variants/axiometa_genesis_mini)
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
; 3 MB app, no OTA, fits in 4 MB flash
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

[env:control_test]
build_src_filter = -<*> +<control_test/>
lib_deps =
    mathertel/RotaryEncoder@^1.5.3

[env:handheld]
build_src_filter = -<*> +<handheld/>
lib_deps =
    mathertel/RotaryEncoder@^1.5.3

[env:receiver]
build_src_filter = -<*> +<receiver/>

; Paused single-board design. Not built with the other two.
[env:rover]
build_src_filter = +<*> -<control_test/> -<receiver/> -<handheld/>
lib_deps =
    bblanchon/ArduinoJson@^7
; Uncomment once you have exported an Edge Impulse Arduino library (its .zip goes in lib/):
; build_flags =
;     ${env.build_flags}
;     -DUSE_EDGE_IMPULSE
;     -DEI_HEADER=\"rover_wakeword_inferencing.h\"
;     -DWAKE_LABEL=\"hey_rover\"
